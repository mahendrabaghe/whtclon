<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f4f7f5">
    <meta name="description" content="ConnectX — private conversations, wherever you are.">
    <title>ConnectX — Stay close</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css?v=20261023-3">
    <script src="./config.js?v=20261023-3" defer></script>
    <script src="./app.js?v=20261023-3" defer></script>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <section class="loading-screen"><span class="brand-mark">C</span><p>Connecting you…</p></section>
    </main>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <dialog id="call-dialog" class="call-dialog">
      <div class="call-dialog-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h3l2 5-2 2a15 15 0 0 0 4 4l2-2 5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 5 5a2 2 0 0 1 2-2Z"/></svg></div>
      <p class="eyebrow" id="call-label">INCOMING CALL</p>
      <h2 id="call-name">Someone is calling</h2>
      <p id="call-kind">Audio call</p>
      <div class="call-actions">
        <button class="button danger" id="reject-call" type="button">Decline</button>
        <button class="button primary" id="accept-call" type="button">Accept</button>
      </div>
    </dialog>
  </body>
</html>
